services:
  bot:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/myfood.db
      LOG_FORMAT: json
    volumes:
      - myfood-data:/data
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-m", "app.commands.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  myfood-data:
